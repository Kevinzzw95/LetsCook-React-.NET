name: letscook

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-db-url: &db-url "postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}"
x-cloudinary: &cloudinary
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  migrate:
    build:
      context: ./backend/MAIN_API
      target: migration
    environment:
      DATABASE_URL: *db-url
      BASELINE_RESTORED: ${BASELINE_RESTORED:-false}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      RECIPE_VECTOR_COLLECTION: ${RECIPE_VECTOR_COLLECTION:-letscook_recipes}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  main-api:
    build:
      context: ./backend/MAIN_API
      target: runtime
    environment:
      <<: *cloudinary
      NODE_ENV: production
      PORT: "5001"
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      USDA_API_KEY: ${USDA_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    init: true
    logging: *logging

  ai-api:
    build: ./backend/AI_API
    environment:
      <<: *cloudinary
      RECIPE_DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      ENABLE_CRAWLER: "false"
      AUTO_CREATE_SCHEMA: "false"
      REQUEST_TIMEOUT_SECONDS: "180"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      RECIPE_VECTOR_COLLECTION: ${RECIPE_VECTOR_COLLECTION:-letscook_recipes}
      API_KEY_GEMINI: ${API_KEY_GEMINI:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MEAL_PLAN_TIMEZONE: ${MEAL_PLAN_TIMEZONE:-America/Toronto}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    init: true
    logging: *logging

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      main-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
