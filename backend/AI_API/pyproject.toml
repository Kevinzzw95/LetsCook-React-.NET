[project]
name = "mediacrawler"
author = "程序员阿江-Relakkes <relakkes@gmail.com>"
version = "0.1.0"
description = "A social media crawler project, support Xiaohongshu, Weibo, Zhihu, Bilibili, Douyin, BaiduTieBa etc."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloudinary",
    "fastapi==0.110.2",
    "google-genai",
    "httpx==0.28.1",
    "openai>=1.90.0",
    "pillow>=10.4.0",
    "pydantic>=2.7.4",
    "python-multipart",
    "python-dotenv==1.0.1",
    "redis~=4.6.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.43",
    "tavily-python>=0.7.0",
    "tenacity>=8.2.3",
    "uvicorn==0.29.0",
    "asyncpg>=0.31.0",
    "langgraph>=0.2.60",
    "langchain-openai>=1.3.0",
    "langsmith[openai-agents]>=0.8.11",
    "langchain-postgres>=0.0.17",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
crawler = [
    "aiofiles~=23.2.1",
    "aiomysql==0.2.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.5",
    "asyncmy>=0.2.10",
    "beautifulsoup4",
    "cryptography>=45.0.7",
    "jieba==0.42.1",
    "matplotlib==3.9.0",
    "motor>=3.3.0",
    "opencv-python>=4.11.0.86",
    "pandas==2.2.3",
    "parsel==1.9.1",
    "playwright==1.45.0",
    "pyexecjs==1.5.1",
    "pyhumps>=3.8.0",
    "typer>=0.12.3",
    "wordcloud==1.9.3",
    "openpyxl>=3.1.2",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ragas>=0.4.3",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
