server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Docker DNS is resolved per request, including after API container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $main_upstream main-api:5001;
        proxy_pass http://$main_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ai/ {
        set $ai_upstream ai-api:8088;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://$ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 210s;
        proxy_buffering off;
    }
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
